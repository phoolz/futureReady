    <style>
      .zen-garden .primary {
        background: #e5d5c0;
      }

      .zen-garden .tip {
        color: #a09080;
      }

      .zen-tools {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(calc(-50% + 100px));
        display: flex;
        gap: 8px;
        background: white;
        padding: 8px 12px;
        border-radius: 30px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        z-index: 10;
        align-items: center;
      }

      .zen-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #ddd;
        background: #f5f5f5;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
        font-size: 11px;
        font-weight: bold;
        color: #666;
      }

      .zen-btn:hover {
        border-color: #aaa;
        background: #eee;
      }

      .zen-btn.active {
        border-color: #8b7355;
        background: #d4c4af;
        color: #5a4a3a;
      }

      .tool-divider {
        width: 1px;
        height: 24px;
        background: #ddd;
        margin: 0 4px;
      }

      .width-icon {
        font-size: 14px;
        color: #888;
        font-weight: 600;
      }

      .zen-btn.active .width-icon {
        color: #5a4a3a;
      }

      .prong-icon {
        display: flex;
        gap: 2px;
        align-items: center;
      }

      .prong-icon span {
        background: #888;
        border-radius: 1px;
        width: 2px;
        height: 16px;
      }

      .zen-btn.active .prong-icon span {
        background: #5a4a3a;
      }

      @media screen and (max-width: 670px) {
        .zen-tools {
          transform: translateX(-50%);
          bottom: 130px;
        }
      }
    </style>

  <body class="paint-app zen-garden">
    <div class="painting">
      <div class="ui top-left">
        <a class="icon" href="https://paint.toys/">

        </a>
      </div>
      <div class="ui top-right">
        <a class="icon" href="https://paint.toys/zen-garden/about">

        </a>
        <a class="icon save">
          <img class="smaller" src="./Zen Garden_files/icon-disk.png" alt="Save artwork">
        </a>
        <a class="icon trash">
          <img class="smaller" src="./Zen Garden_files/icon-trash.png" alt="Clear canvas">
        </a>
      </div>
      <div class="canvas-wrapper">
        <canvas id="canvas" class="primary" width="2074" height="2626"></canvas>
        <div class="tip">Drag to rake patterns in the sand<br><br>Find peace in the simple act of creation</div>
      </div>
      <div class="zen-tools">
        <button class="zen-btn width-btn" onclick="setRakeWidth(0)" title="Narrow">
          <div class="width-icon">S</div>
        </button>
        <button class="zen-btn width-btn active" onclick="setRakeWidth(1)" title="Medium">
          <div class="width-icon">M</div>
        </button>
        <button class="zen-btn width-btn" onclick="setRakeWidth(2)" title="Wide">
          <div class="width-icon">W</div>
        </button>
        <div class="tool-divider"></div>
        <button class="zen-btn prong-btn" onclick="setRakeProngs(0)" title="1 prong">
          <div class="prong-icon"><span></span></div>
        </button>
        <button class="zen-btn prong-btn" onclick="setRakeProngs(1)" title="2 prongs">
          <div class="prong-icon"><span></span><span></span></div>
        </button>
        <button class="zen-btn prong-btn" onclick="setRakeProngs(2)" title="3 prongs">
          <div class="prong-icon"><span></span><span></span><span></span></div>
        </button>
        <button class="zen-btn prong-btn active" onclick="setRakeProngs(3)" title="5 prongs">
          <div class="prong-icon"><span></span><span></span><span></span><span></span><span></span></div>
        </button>
        <button class="zen-btn prong-btn" onclick="setRakeProngs(4)" title="7 prongs">
          <div class="prong-icon"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
        </button>
      </div>

    <script>
      document.querySelector('.trash').addEventListener('click', () => {
        window.resetZenGarden()
      });

      function save() {
        let downloadLink = document.createElement("a");
        downloadLink.setAttribute("download", "paint-toys-zen-garden.png");
        let canvas = document.getElementById("canvas");
        canvas.toBlob(function (blob) {
          let url = URL.createObjectURL(blob);
          downloadLink.setAttribute("href", url);
          downloadLink.click();
        });
      }

      document.querySelector(".save").addEventListener("click", () => {
        save();
      });
    </script>
